<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 520" width="1040" height="520" role="img" aria-label="Aspire orchestration: the BrewOrchestrator.Host AppHost reads parameters from user secrets and starts five containers (four MCP servers and the Knowledge Agent) plus the BrewUp.Rest project, injecting connection strings, endpoint references and the OTLP endpoint; the Knowledge Agent waits for the Knowledge MCP server and BrewUp.Rest waits for all four MCP servers. Container images must already exist locally.">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B6257"/>
    </marker>
    <marker id="ari" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B4BB5"/>
    </marker>
    <marker id="ars" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#40607A"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1040" height="520" fill="#FBF7F0"/>

  <g font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
    <text x="32" y="34" font-size="19" font-weight="600" fill="#2B2622">Aspire orchestration — what the AppHost starts</text>

    <rect x="40" y="52" width="260" height="64" rx="7" fill="#FFFFFF" stroke="#B9AE9B" stroke-width="1.4"/>
    <text x="170" y="76" font-size="12.5" font-weight="600" text-anchor="middle" fill="#2B2622">AppHost parameters</text>
    <text x="170" y="95" font-size="10" text-anchor="middle" fill="#6B6257">user secrets: Parameters:&lt;name&gt;</text>
    <text x="170" y="108" font-size="10" text-anchor="middle" fill="#6B6257">Mongo · SQL · Service Bus · OpenAI</text>

    <rect x="380" y="52" width="280" height="64" rx="7" fill="#FDF1DE" stroke="#C2761B" stroke-width="1.6"/>
    <text x="520" y="78" font-size="13" font-weight="600" text-anchor="middle" fill="#8A5210">BrewOrchestrator.Host</text>
    <text x="520" y="98" font-size="10" text-anchor="middle" fill="#C2761B">Aspire AppHost · aspire run</text>

    <rect x="740" y="52" width="260" height="64" rx="7" fill="#E8EFF5" stroke="#40607A" stroke-width="1.4"/>
    <text x="870" y="78" font-size="12.5" font-weight="600" text-anchor="middle" fill="#22384A">Aspire Dashboard</text>
    <text x="870" y="98" font-size="10" text-anchor="middle" fill="#40607A">traces · metrics · logs · resource state</text>

    <line x1="300" y1="84" x2="376" y2="84" stroke="#6B6257" stroke-width="1.4" marker-end="url(#ar)"/>
    <line x1="660" y1="84" x2="736" y2="84" stroke="#40607A" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#ars)"/>
    <text x="698" y="76" font-size="9.5" text-anchor="middle" fill="#40607A">OTLP</text>

    <!-- distribution bar -->
    <line x1="520" y1="116" x2="520" y2="160" stroke="#6B6257" stroke-width="1.4"/>
    <line x1="114" y1="160" x2="924" y2="160" stroke="#6B6257" stroke-width="1.4"/>
    <text x="532" y="142" font-size="10" fill="#6B6257">injects parameters · endpoint references · OTEL_EXPORTER_OTLP_ENDPOINT</text>
    <g stroke="#6B6257" stroke-width="1.3">
      <line x1="114" y1="160" x2="114" y2="186" marker-end="url(#ar)"/>
      <line x1="276" y1="160" x2="276" y2="186" marker-end="url(#ar)"/>
      <line x1="438" y1="160" x2="438" y2="186" marker-end="url(#ar)"/>
      <line x1="600" y1="160" x2="600" y2="186" marker-end="url(#ar)"/>
      <line x1="762" y1="160" x2="762" y2="186" marker-end="url(#ar)"/>
      <line x1="924" y1="160" x2="924" y2="186" marker-end="url(#ar)"/>
    </g>

    <!-- resources -->
    <g>
      <rect x="40" y="190" width="148" height="72" rx="7" fill="#FDF1DE" stroke="#C2761B" stroke-width="1.5"/>
      <text x="114" y="212" font-size="11.5" font-weight="600" text-anchor="middle" fill="#8A5210">knowledge-mcp</text>
      <text x="114" y="230" font-size="10" text-anchor="middle" fill="#C2761B">container · :8081</text>
      <text x="114" y="250" font-size="9" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" text-anchor="middle" fill="#C2761B">brewup.knowledge.mcpserver</text>

      <rect x="202" y="190" width="148" height="72" rx="7" fill="#FDF1DE" stroke="#C2761B" stroke-width="1.5"/>
      <text x="276" y="212" font-size="11.5" font-weight="600" text-anchor="middle" fill="#8A5210">masterdata-mcp</text>
      <text x="276" y="230" font-size="10" text-anchor="middle" fill="#C2761B">container · :8082</text>
      <text x="276" y="250" font-size="9" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" text-anchor="middle" fill="#C2761B">brewup.masterdata.mcpserver</text>

      <rect x="364" y="190" width="148" height="72" rx="7" fill="#FDF1DE" stroke="#C2761B" stroke-width="1.5"/>
      <text x="438" y="212" font-size="11.5" font-weight="600" text-anchor="middle" fill="#8A5210">warehouse-mcp</text>
      <text x="438" y="230" font-size="10" text-anchor="middle" fill="#C2761B">container · :8083</text>
      <text x="438" y="250" font-size="9" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" text-anchor="middle" fill="#C2761B">brewup.warehouse.mcpserver</text>

      <rect x="526" y="190" width="148" height="72" rx="7" fill="#FDF1DE" stroke="#C2761B" stroke-width="1.5"/>
      <text x="600" y="212" font-size="11.5" font-weight="600" text-anchor="middle" fill="#8A5210">sales-mcp</text>
      <text x="600" y="230" font-size="10" text-anchor="middle" fill="#C2761B">container · :8084</text>
      <text x="600" y="250" font-size="9" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" text-anchor="middle" fill="#C2761B">brewup.sales.mcpserver</text>

      <rect x="688" y="190" width="148" height="72" rx="7" fill="#ECECFB" stroke="#4B4BB5" stroke-width="1.5"/>
      <text x="762" y="212" font-size="11.5" font-weight="600" text-anchor="middle" fill="#33338F">knowledge-agent</text>
      <text x="762" y="230" font-size="10" text-anchor="middle" fill="#4B4BB5">container · :8080</text>
      <text x="762" y="250" font-size="9" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" text-anchor="middle" fill="#4B4BB5">brewup.knowledge.agent</text>

      <rect x="850" y="190" width="148" height="72" rx="7" fill="#E6F1EA" stroke="#2F6B4F" stroke-width="1.5"/>
      <text x="924" y="212" font-size="11.5" font-weight="600" text-anchor="middle" fill="#1F4A36">brewup-rest</text>
      <text x="924" y="230" font-size="10" text-anchor="middle" fill="#2F6B4F">project · AddProject</text>
      <text x="924" y="250" font-size="9" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" text-anchor="middle" fill="#2F6B4F">BrewUp.Rest</text>
    </g>

    <!-- dependencies -->
    <path d="M762,262 V300 H104 V270" fill="none" stroke="#4B4BB5" stroke-width="1.4" marker-end="url(#ari)"/>
    <rect x="270" y="280" width="320" height="14" fill="#FBF7F0"/>
    <text x="430" y="291" font-size="10" text-anchor="middle" fill="#33338F">WaitFor(knowledge-mcp) · injects KnowledgeAgent__Mcp__Endpoint</text>

    <path d="M924,262 V346 H124" fill="none" stroke="#6B6257" stroke-width="1.3"/>
    <g stroke="#6B6257" stroke-width="1.3">
      <line x1="124" y1="346" x2="124" y2="272" marker-end="url(#ar)"/>
      <line x1="286" y1="346" x2="286" y2="272" marker-end="url(#ar)"/>
      <line x1="448" y1="346" x2="448" y2="272" marker-end="url(#ar)"/>
      <line x1="610" y1="346" x2="610" y2="272" marker-end="url(#ar)"/>
    </g>
    <text x="430" y="366" font-size="10" text-anchor="middle" fill="#6B6257">brewup-rest: WaitFor(...) + WithReference(...) on all four MCP endpoints</text>

    <!-- images note -->
    <rect x="40" y="396" width="958" height="92" rx="7" fill="#FDF1DE" stroke="#C2761B" stroke-width="1.4"/>
    <text x="58" y="422" font-size="12" font-weight="600" fill="#8A5210">The AppHost references images by name — it never builds them.</text>
    <text x="58" y="444" font-size="10.5" fill="#8A5210">AddContainer("knowledge-mcp", "brewup.knowledge.mcpserver", "latest") resolves an image that must already exist in your local Docker or in the registry.</text>
    <text x="58" y="466" font-size="10.5" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#8A5210">docker compose -f infra/Docker/mcp-docker-compose.yml --project-directory src/BrewApi build</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 590" width="1040" height="590" role="img" aria-label="Sequence of a knowledge question: the Mother coordinator fetches the agent card, posts an A2A task to the Knowledge Agent, the agent lists and calls the search_knowledge_base tool on the Knowledge MCP server, which embeds the query and vector-searches the store, and the scored findings travel back as an A2A task response.">
  <defs>
    <marker id="mi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B4BB5"/>
    </marker>
    <marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C2761B"/>
    </marker>
    <marker id="ms" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#40607A"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1040" height="590" fill="#FBF7F0"/>

  <g font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
    <text x="32" y="38" font-size="19" font-weight="600" fill="#2B2622">A knowledge question, end to end (A2A + MCP)</text>

    <!-- participants -->
    <rect x="50" y="64" width="200" height="54" rx="7" fill="#FFFFFF" stroke="#B9AE9B" stroke-width="1.4"/>
    <text x="150" y="86" font-size="12.5" font-weight="600" text-anchor="middle" fill="#2B2622">Mother Coordinator</text>
    <text x="150" y="104" font-size="10" text-anchor="middle" fill="#6B6257">in BrewUp.Rest · ChatModule</text>

    <rect x="320" y="64" width="220" height="54" rx="7" fill="#ECECFB" stroke="#4B4BB5" stroke-width="1.5"/>
    <text x="430" y="86" font-size="12.5" font-weight="600" text-anchor="middle" fill="#33338F">Knowledge Agent</text>
    <text x="430" y="104" font-size="10" text-anchor="middle" fill="#4B4BB5">BrewUp.Knowledge.Agent :8080</text>

    <rect x="600" y="64" width="200" height="54" rx="7" fill="#FDF1DE" stroke="#C2761B" stroke-width="1.5"/>
    <text x="700" y="86" font-size="12.5" font-weight="600" text-anchor="middle" fill="#8A5210">Knowledge MCP</text>
    <text x="700" y="104" font-size="10" text-anchor="middle" fill="#C2761B">:8081 /mcp</text>

    <rect x="850" y="64" width="170" height="54" rx="7" fill="#E8EFF5" stroke="#40607A" stroke-width="1.4"/>
    <text x="935" y="86" font-size="12.5" font-weight="600" text-anchor="middle" fill="#22384A">Vector store</text>
    <text x="935" y="104" font-size="10" text-anchor="middle" fill="#40607A">SQL Server + embeddings</text>

    <!-- lifelines -->
    <g stroke-dasharray="4 5" stroke-width="1.2">
      <line x1="150" y1="118" x2="150" y2="528" stroke="#B9AE9B"/>
      <line x1="430" y1="118" x2="430" y2="528" stroke="#4B4BB5" opacity="0.55"/>
      <line x1="700" y1="118" x2="700" y2="528" stroke="#C2761B" opacity="0.55"/>
      <line x1="935" y1="118" x2="935" y2="528" stroke="#40607A" opacity="0.55"/>
    </g>

    <g font-size="9.5">
      <!-- 1 -->
      <line x1="150" y1="158" x2="426" y2="158" stroke="#4B4BB5" stroke-width="1.5" marker-end="url(#mi)"/>
      <text x="288" y="151" font-size="9.5" text-anchor="middle" fill="#33338F">GET /.well-known/agent-card.json</text>
      <!-- 2 -->
      <line x1="430" y1="196" x2="154" y2="196" stroke="#4B4BB5" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#mi)"/>
      <text x="292" y="189" text-anchor="middle" fill="#33338F">AgentCard — skills, capabilities, sample questions</text>
      <!-- 3 -->
      <line x1="150" y1="234" x2="426" y2="234" stroke="#4B4BB5" stroke-width="1.5" marker-end="url(#mi)"/>
      <text x="288" y="227" text-anchor="middle" fill="#33338F">POST /a2a/tasks { message, correlationId }</text>
      <!-- 4 -->
      <line x1="430" y1="272" x2="696" y2="272" stroke="#C2761B" stroke-width="1.5" marker-end="url(#ma)"/>
      <text x="563" y="265" text-anchor="middle" fill="#8A5210">tools/list — discover what this server offers</text>
      <!-- 5 -->
      <line x1="700" y1="310" x2="434" y2="310" stroke="#C2761B" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#ma)"/>
      <text x="567" y="303" text-anchor="middle" fill="#8A5210">search_knowledge_base is available</text>
      <!-- 6 -->
      <line x1="430" y1="348" x2="696" y2="348" stroke="#C2761B" stroke-width="1.5" marker-end="url(#ma)"/>
      <text x="563" y="341" text-anchor="middle" fill="#8A5210">tools/call search_knowledge_base { query, topK }</text>
      <!-- 7 -->
      <line x1="700" y1="386" x2="931" y2="386" stroke="#40607A" stroke-width="1.5" marker-end="url(#ms)"/>
      <text x="815" y="379" text-anchor="middle" fill="#22384A">embed query · vector search top-K</text>
      <!-- 8 -->
      <line x1="935" y1="424" x2="704" y2="424" stroke="#40607A" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#ms)"/>
      <text x="819" y="417" text-anchor="middle" fill="#22384A">chunks + similarity scores</text>
      <!-- 9 -->
      <line x1="700" y1="462" x2="434" y2="462" stroke="#C2761B" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#ma)"/>
      <text x="567" y="455" text-anchor="middle" fill="#8A5210">SearchKnowledgeResult</text>
      <!-- 10 -->
      <line x1="430" y1="500" x2="154" y2="500" stroke="#4B4BB5" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#mi)"/>
      <text x="292" y="493" text-anchor="middle" fill="#33338F">A2ATaskResponse { findings, summary, correlationId }</text>
    </g>

    <text x="32" y="552" font-size="10.5" fill="#6B6257">Mother takes this path when BrewUp:Mother:A2A:Enabled is true and the question looks like a knowledge question (policy, procedure, documentation, quality standard, …).</text>
    <text x="32" y="570" font-size="10.5" fill="#6B6257">Every hop carries the same correlationId and is traced: Mother emits Agent.KnowledgeAgent.A2A on the BrewUp.Mother activity source, so the whole chain shows up in the Aspire dashboard.</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 690" width="1040" height="690" role="img" aria-label="BrewUpErp runtime architecture: BrewSpa and BrewApp call BrewUp.Rest, whose Mother coordinator calls four per-module MCP servers over HTTP and the Knowledge A2A agent, which in turn calls the Knowledge MCP server. Everything runs under the Aspire AppHost and exports OTLP telemetry to the Aspire dashboard.">
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B6257"/>
    </marker>
    <marker id="a1i" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B4BB5"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1040" height="690" fill="#FBF7F0"/>

  <g font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
    <text x="40" y="38" font-size="19" font-weight="600" fill="#2B2622">BrewUpErp — runtime architecture</text>

    <!-- clients -->
    <rect x="64" y="64" width="190" height="58" rx="6" fill="#FFFFFF" stroke="#B9AE9B" stroke-width="1.4"/>
    <text x="159" y="88" font-size="13" font-weight="600" text-anchor="middle" fill="#2B2622">BrewSpa</text>
    <text x="159" y="106" font-size="10.5" text-anchor="middle" fill="#6B6257">Blazor web front-end</text>

    <rect x="274" y="64" width="190" height="58" rx="6" fill="#FFFFFF" stroke="#B9AE9B" stroke-width="1.4"/>
    <text x="369" y="88" font-size="13" font-weight="600" text-anchor="middle" fill="#2B2622">BrewApp</text>
    <text x="369" y="106" font-size="10.5" text-anchor="middle" fill="#6B6257">.NET MAUI mobile</text>

    <rect x="790" y="64" width="210" height="58" rx="6" fill="#E8EFF5" stroke="#40607A" stroke-width="1.4"/>
    <text x="895" y="88" font-size="13" font-weight="600" text-anchor="middle" fill="#22384A">Aspire Dashboard</text>
    <text x="895" y="106" font-size="10.5" text-anchor="middle" fill="#40607A">traces · metrics · logs</text>

    <line x1="159" y1="122" x2="159" y2="192" stroke="#6B6257" stroke-width="1.4" marker-end="url(#a1)"/>
    <text x="167" y="146" font-size="10" fill="#6B6257">REST</text>
    <line x1="369" y1="122" x2="369" y2="192" stroke="#6B6257" stroke-width="1.4" marker-end="url(#a1)"/>
    <text x="377" y="146" font-size="10" fill="#6B6257">REST</text>

    <!-- aspire apphost boundary -->
    <rect x="44" y="158" width="956" height="372" rx="10" fill="none" stroke="#C2761B" stroke-width="1.6" stroke-dasharray="7 5"/>
    <text x="440" y="180" font-size="11" font-weight="600" fill="#9C5C12">Aspire AppHost · BrewOrchestrator.Host — starts the containers, injects configuration, wires telemetry</text>
    <line x1="898" y1="158" x2="898" y2="126" stroke="#40607A" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#a1)"/>
    <text x="906" y="146" font-size="10" fill="#40607A">OTLP</text>

    <!-- rest api -->
    <rect x="64" y="196" width="936" height="104" rx="7" fill="#E6F1EA" stroke="#2F6B4F" stroke-width="1.5"/>
    <text x="80" y="222" font-size="14" font-weight="600" fill="#1F4A36">BrewUp.Rest — modular monolith (ASP.NET Core, .NET 10)</text>
    <text x="80" y="248" font-size="11" fill="#2F6B4F">Modules: MasterData · Purchases · Sales · Warehouse · Dashboards · Sagas · Knowledge (/v1/knowledge) · Chat (Mother, /chat)</text>
    <text x="80" y="268" font-size="11" fill="#2F6B4F">DDD + CQRS over Muflone · KurrentDB event store · RabbitMQ or Azure Service Bus</text>
    <text x="80" y="288" font-size="11" fill="#2F6B4F">Scalar OpenAPI · Serilog · OpenTelemetry tracing (Mother.* and BrewUp.Chat activity sources)</text>

    <!-- mother + agent -->
    <rect x="64" y="330" width="280" height="60" rx="7" fill="#FFFFFF" stroke="#B9AE9B" stroke-width="1.4"/>
    <text x="204" y="354" font-size="12.5" font-weight="600" text-anchor="middle" fill="#2B2622">Mother Coordinator</text>
    <text x="204" y="373" font-size="10.5" text-anchor="middle" fill="#6B6257">Azure OpenAI function calling + A2A</text>

    <rect x="404" y="330" width="300" height="60" rx="7" fill="#ECECFB" stroke="#4B4BB5" stroke-width="1.5"/>
    <text x="554" y="352" font-size="12.5" font-weight="600" text-anchor="middle" fill="#33338F">BrewUp.Knowledge.Agent · A2A :8080</text>
    <text x="554" y="370" font-size="10" text-anchor="middle" fill="#4B4BB5">/.well-known/agent-card.json</text>
    <text x="554" y="383" font-size="10" text-anchor="middle" fill="#4B4BB5">POST /a2a/tasks</text>

    <line x1="344" y1="360" x2="400" y2="360" stroke="#4B4BB5" stroke-width="1.6" marker-end="url(#a1i)"/>
    <text x="372" y="352" font-size="9.5" text-anchor="middle" fill="#33338F">A2A task</text>

    <!-- mcp servers -->
    <rect x="64" y="420" width="146" height="76" rx="7" fill="#FDF1DE" stroke="#C2761B" stroke-width="1.5"/>
    <text x="137" y="444" font-size="12" font-weight="600" text-anchor="middle" fill="#8A5210">MasterData MCP</text>
    <text x="137" y="463" font-size="10" text-anchor="middle" fill="#C2761B">:8082 · 8 tools</text>
    <text x="137" y="481" font-size="9.5" text-anchor="middle" fill="#C2761B">beers · customers · suppliers</text>

    <rect x="226" y="420" width="146" height="76" rx="7" fill="#FDF1DE" stroke="#C2761B" stroke-width="1.5"/>
    <text x="299" y="444" font-size="12" font-weight="600" text-anchor="middle" fill="#8A5210">Sales MCP</text>
    <text x="299" y="463" font-size="10" text-anchor="middle" fill="#C2761B">:8084 · 7 tools</text>
    <text x="299" y="481" font-size="9.5" text-anchor="middle" fill="#C2761B">orders · late · totals</text>

    <rect x="388" y="420" width="146" height="76" rx="7" fill="#FDF1DE" stroke="#C2761B" stroke-width="1.5"/>
    <text x="461" y="444" font-size="12" font-weight="600" text-anchor="middle" fill="#8A5210">Warehouse MCP</text>
    <text x="461" y="463" font-size="10" text-anchor="middle" fill="#C2761B">:8083 · 2 tools</text>
    <text x="461" y="481" font-size="9.5" text-anchor="middle" fill="#C2761B">availability · reorder</text>

    <rect x="550" y="420" width="146" height="76" rx="7" fill="#FDF1DE" stroke="#C2761B" stroke-width="1.5"/>
    <text x="623" y="444" font-size="12" font-weight="600" text-anchor="middle" fill="#8A5210">Knowledge MCP</text>
    <text x="623" y="463" font-size="10" text-anchor="middle" fill="#C2761B">:8081 · 1 tool</text>
    <text x="623" y="481" font-size="9.5" text-anchor="middle" fill="#C2761B">search_knowledge_base</text>

    <!-- mother fan-out to mcp -->
    <line x1="196" y1="390" x2="140" y2="416" stroke="#6B6257" stroke-width="1.3" marker-end="url(#a1)"/>
    <line x1="210" y1="390" x2="295" y2="416" stroke="#6B6257" stroke-width="1.3" marker-end="url(#a1)"/>
    <line x1="222" y1="390" x2="455" y2="416" stroke="#6B6257" stroke-width="1.3" marker-end="url(#a1)"/>
    <line x1="232" y1="390" x2="612" y2="416" stroke="#6B6257" stroke-width="1.3" marker-end="url(#a1)"/>
    <text x="66" y="402" font-size="9.5" fill="#6B6257">MCP tool</text>
    <text x="66" y="414" font-size="9.5" fill="#6B6257">calls · /mcp</text>

    <!-- agent to knowledge mcp -->
    <line x1="560" y1="390" x2="616" y2="416" stroke="#4B4BB5" stroke-width="1.5" marker-end="url(#a1i)"/>
    <text x="648" y="404" font-size="9.5" fill="#33338F">tools/call search_knowledge_base</text>

    <!-- data row -->
    <rect x="64" y="560" width="280" height="56" rx="6" fill="#E8EFF5" stroke="#40607A" stroke-width="1.4"/>
    <text x="204" y="582" font-size="12" font-weight="600" text-anchor="middle" fill="#22384A">MongoDB</text>
    <text x="204" y="600" font-size="10" text-anchor="middle" fill="#40607A">read models per bounded context</text>

    <rect x="364" y="560" width="230" height="56" rx="6" fill="#E8EFF5" stroke="#40607A" stroke-width="1.4"/>
    <text x="479" y="582" font-size="12" font-weight="600" text-anchor="middle" fill="#22384A">SQL Server</text>
    <text x="479" y="600" font-size="10" text-anchor="middle" fill="#40607A">Knowledge chunks + vectors</text>

    <rect x="614" y="560" width="180" height="56" rx="6" fill="#E8EFF5" stroke="#40607A" stroke-width="1.4"/>
    <text x="704" y="582" font-size="12" font-weight="600" text-anchor="middle" fill="#22384A">Azure OpenAI</text>
    <text x="704" y="600" font-size="10" text-anchor="middle" fill="#40607A">chat + embeddings</text>

    <rect x="814" y="560" width="186" height="56" rx="6" fill="#E8EFF5" stroke="#40607A" stroke-width="1.4"/>
    <text x="907" y="582" font-size="12" font-weight="600" text-anchor="middle" fill="#22384A">KurrentDB · RabbitMQ</text>
    <text x="907" y="600" font-size="10" text-anchor="middle" fill="#40607A">events · commands</text>

    <line x1="137" y1="496" x2="130" y2="556" stroke="#6B6257" stroke-width="1.3" marker-end="url(#a1)"/>
    <line x1="299" y1="496" x2="215" y2="556" stroke="#6B6257" stroke-width="1.3" marker-end="url(#a1)"/>
    <line x1="461" y1="496" x2="300" y2="556" stroke="#6B6257" stroke-width="1.3" marker-end="url(#a1)"/>
    <text x="88" y="540" font-size="9.5" fill="#6B6257">reads</text>

    <line x1="623" y1="496" x2="500" y2="556" stroke="#6B6257" stroke-width="1.3" marker-end="url(#a1)"/>
    <text x="576" y="522" font-size="9.5" fill="#6B6257">vector search</text>

    <path d="M712,300 V540 H704 V556" fill="none" stroke="#6B6257" stroke-width="1.3" marker-end="url(#a1)"/>
    <text x="720" y="470" font-size="9.5" fill="#6B6257">chat completions · embeddings</text>

    <path d="M960,300 V540 H907 V556" fill="none" stroke="#6B6257" stroke-width="1.3" marker-end="url(#a1)"/>
    <text x="952" y="424" font-size="9.5" text-anchor="end" fill="#6B6257">publish · subscribe</text>

    <text x="40" y="666" font-size="10.5" fill="#6B6257">Each MCP server is a standalone container speaking MCP over HTTP at /mcp — usable from VS Code, Claude Code, or any MCP client, not just from Mother.</text>
  </g>
</svg>

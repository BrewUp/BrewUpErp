openapi: 3.1.1
info:
  title: BrewUp API
  description: BrewUp API
  contact:
    name: BrewUp Team
  version: v1.0
servers:
  - url: /
paths:
  /v1/masterdata/customers:
    post:
      tags:
        - MasterData
      summary: Create a new customer
      description: Creates a new customer. This endpoint is used to add a new customer.
      operationId: CreateCustomer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterCustomerJson"
        required: true
      responses:
        "201":
          description: Created
        "500":
          description: Internal Server Error
    get:
      tags:
        - MasterData
      summary: Get a list of customers
      description: Get a list of customers.
      operationId: GetCustomers
      parameters:
        - name: pageNumber
          in: query
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int32
            default: 1
        - name: pageSize
          in: query
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int32
            default: 10
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedResultOfCustomerJson"
        "500":
          description: Internal Server Error
  /v1/masterdata/customers/{customerId}:
    put:
      tags:
        - MasterData
      summary: Save customer
      description: Save full details of a customer.
      operationId: SaveCustomer
      parameters:
        - name: customerId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditCustomerJson"
        required: true
      responses:
        "202":
          description: Accepted
        "500":
          description: Internal Server Error
    patch:
      tags:
        - MasterData
      summary: Update customer's properties
      description: Update properties of a customer.
      operationId: UpdateCustomerProperties
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerPropertiesJson"
        required: true
      responses:
        "202":
          description: Accepted
        "500":
          description: Internal Server Error
    delete:
      tags:
        - MasterData
      summary: Delete customer
      description: Delete a customer.
      operationId: DeleteCustomer
      parameters:
        - name: customerId
          in: path
          required: true
          schema:
            type: string
      responses:
        "202":
          description: Accepted
        "500":
          description: Internal Server Error
    get:
      tags:
        - MasterData
      summary: Get a customer details
      description: Get full details of a customer.
      operationId: GetCustomerById
      parameters:
        - name: customerId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerJson"
        "500":
          description: Internal Server Error
  /v1/masterdata/suppliers:
    post:
      tags:
        - MasterData
      summary: Create a new supplier
      description: Creates a new supplier. This endpoint is used to add a new supplier.
      operationId: CreateSupplier
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterSupplierJson"
        required: true
      responses:
        "201":
          description: Created
        "500":
          description: Internal Server Error
    get:
      tags:
        - MasterData
      summary: Get a list of suppliers
      description: Get a list of suppliers.
      operationId: GetSuppliers
      parameters:
        - name: pageNumber
          in: query
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int32
            default: 1
        - name: pageSize
          in: query
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int32
            default: 10
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedResultOfSupplierJson"
        "500":
          description: Internal Server Error
  /v1/masterdata/suppliers/{supplierId}:
    get:
      tags:
        - MasterData
      summary: Get a supplier details
      description: Get full details of a supplier.
      operationId: GetSupplierById
      parameters:
        - name: supplierId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupplierJson"
        "500":
          description: Internal Server Error
  /v1/masterdata/beers:
    post:
      tags:
        - MasterData
      summary: Create a new beer
      description: Creates a new beer. This endpoint is used to add a new beer.
      operationId: CreateBeer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterBeerJson"
        required: true
      responses:
        "201":
          description: Created
        "500":
          description: Internal Server Error
    get:
      tags:
        - MasterData
      summary: Get a list of beers
      description: Get a list of all beers. This endpoint is used to get a list of all
        beers.
      operationId: GetBeers
      parameters:
        - name: pageNumber
          in: query
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int32
            default: 1
        - name: pageSize
          in: query
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int32
            default: 10
      responses:
        "201":
          description: Created
        "500":
          description: Internal Server Error
  /v1/masterdata/warehouse:
    post:
      tags:
        - MasterData
      summary: Create a new warehouse
      description: Creates a new warehouse. This endpoint is used to add a new warehouse.
      operationId: CreateWarehouse
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWarehouseJson"
        required: true
      responses:
        "201":
          description: Created
        "500":
          description: Internal Server Error
    get:
      tags:
        - MasterData
      summary: Get a list of warehouses
      description: Get a list of warehouses.
      operationId: GetWarehouses
      parameters:
        - name: page
          in: query
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int32
            default: 0
        - name: pageSize
          in: query
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int32
            default: 10
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedResultOfWarehouseJson"
        "500":
          description: Internal Server Error
  /v1/purchases:
    post:
      tags:
        - Purchases
      summary: Create a new purchase order
      description: Creates a new purchase order. This endpoint is used to add a new
        purchase order.
      operationId: CreatePurchaseOrder
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePurchaseOrderJson"
        required: true
      responses:
        "201":
          description: Created
        "500":
          description: Internal Server Error
  /v1/sales:
    post:
      tags:
        - Sales
      summary: Create a new sales order
      description: Creates a new sales order. This endpoint is used to add a new sales
        order.
      operationId: CreateSalesOrder
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSalesOrderJson"
        required: true
      responses:
        "201":
          description: Created
        "500":
          description: Internal Server Error
    get:
      tags:
        - Sales
      summary: Get a list of sales orders
      description: Get a list of sales orders.
      operationId: GetSalesOrder
      parameters:
        - name: pageNumber
          in: query
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int32
            default: 1
        - name: pageSize
          in: query
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int32
            default: 10
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedResultOfSalesOrderJson"
        "500":
          description: Internal Server Error
  /v1/sales/rows/{orderId}:
    patch:
      tags:
        - Sales
      summary: Add beers to an existing sales order
      description: Add beers to an existing sales order. This endpoint is used to add
        beers to a sales order.
      operationId: AddBeersToSalesOrder
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddBeersToCartJson"
        required: true
      responses:
        "201":
          description: Created
        "500":
          description: Internal Server Error
  /v1/sales/{orderId}:
    put:
      tags:
        - Sales
      summary: Close an existing sales order
      description: Close a sales order. This endpoint is used to close a sales order.
      operationId: CloseSalesOrder
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Created
        "500":
          description: Internal Server Error
    get:
      tags:
        - Sales
      summary: Get sales order details
      description: Get the full details of a sales order.
      operationId: GetSalesOrderDetails
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedResultOfSalesOrderJson"
        "500":
          description: Internal Server Error
  /v1/warehouse:
    get:
      tags:
        - Warehouse
      summary: Get a list of shipment orders
      description: Get a list of shipment orders.
      operationId: GetShipmentOrders
      parameters:
        - name: pageNumber
          in: query
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int32
            default: 1
        - name: pageSize
          in: query
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int32
            default: 10
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedResultOfShipmentJson"
        "500":
          description: Internal Server Error
    post:
      tags:
        - Warehouse
      summary: Add item stock to a warehouse
      description: Adds item stock to an existing warehouse. This endpoint is used to
        update the stock of an item in a warehouse.
      operationId: AddItemStock
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddItemStockJson"
        required: true
      responses:
        "202":
          description: Accepted
        "500":
          description: Internal Server Error
  /v1/dashboards/customers:
    get:
      tags:
        - Dashboards
      summary: Get a list of sales by Customer
      description: Get a list of sales by Customer.
      operationId: GetSalesByCustomer
      parameters:
        - name: pageNumber
          in: query
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int32
            default: 1
        - name: pageSize
          in: query
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int32
            default: 10
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedResultOfSalesByCustomerJson"
        "500":
          description: Internal Server Error
  /v1/dashboards/products:
    get:
      tags:
        - Dashboards
      summary: Get a list of sales by Product
      description: Get a list of sales by Product.
      operationId: GetSalesByProduct
      parameters:
        - name: pageNumber
          in: query
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int32
            default: 1
        - name: pageSize
          in: query
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int32
            default: 10
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedResultOfSalesByProductsJson"
        "500":
          description: Internal Server Error
  /v1/sagas:
    post:
      tags:
        - Sagas
      summary: Place a new sales order
      description: Place a new sales order. This endpoint is used to place a new sales
        order.
      operationId: PlaceSalesOrder
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaceSalesOrderJson"
        required: true
      responses:
        "201":
          description: Created
        "500":
          description: Internal Server Error
  /chat:
    post:
      tags:
        - BrewUp-Mother
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
        required: true
      responses:
        "200":
          description: OK
  /v1/knowledge/ingest:
    post:
      tags:
        - Knowledge
      summary: Ingest a new Knowledge Document
      description: Ingests a new Knowledge Document. This endpoint is used to add a
        new Knowledge Document.
      operationId: IngestKnowledgeDocument
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestKnowledgeDocument"
        required: true
      responses:
        "201":
          description: Created
        "500":
          description: Internal Server Error
  /v1/knowledge/ingest-file:
    post:
      tags:
        - Knowledge
      summary: Ingest a new Knowledge Document from a file
      description: Ingests a new Knowledge Document from a file. This endpoint is used
        to add a new Knowledge Document.
      operationId: IngestKnowledgeDocumentFromFile
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/KeyValuePairOfstringAndStringValues"
          application/x-www-form-urlencoded:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/KeyValuePairOfstringAndStringValues"
        required: true
      responses:
        "201":
          description: Created
        "500":
          description: Internal Server Error
  /v1/knowledge/documents/{documentId}/chunks:
    get:
      tags:
        - Knowledge
      summary: Get the chunks generated for a Knowledge Document
      description: Returns the generated chunks for inspection, ordered by sequence.
      operationId: GetKnowledgeDocumentChunks
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetKnowledgeDocumentChunksResult"
        "500":
          description: Internal Server Error
  /v1/knowledge/search:
    post:
      tags:
        - Knowledge
      summary: Search Knowledge chunks
      description: Returns the most relevant Knowledge chunks without generating an answer.
      operationId: SearchKnowledge
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchKnowledgeQuery"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchKnowledgeResult"
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/HttpValidationProblemDetails"
        "500":
          description: Internal Server Error
  /v1/knowledge/documents:
    get:
      tags:
        - Knowledge
      summary: List Knowledge Documents
      description: Returns all ingested Knowledge Documents.
      operationId: GetKnowledgeDocuments
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetKnowledgeDocumentsResult"
        "500":
          description: Internal Server Error
  /v1/knowledge/documents/{documentId}:
    get:
      tags:
        - Knowledge
      summary: Get a Knowledge Document
      description: Returns an ingested Knowledge Document and its chunk count.
      operationId: GetKnowledgeDocument
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetKnowledgeDocumentResult"
        "404":
          description: Not Found
        "500":
          description: Internal Server Error
    delete:
      tags:
        - Knowledge
      summary: Delete a Knowledge Document
      description: Deletes the document and its associated chunks and vectors.
      operationId: DeleteKnowledgeDocument
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
        "500":
          description: Internal Server Error
  /v1/knowledge/documents/{documentId}/reindex:
    post:
      tags:
        - Knowledge
      summary: Reindex a Knowledge Document
      description: Regenerates chunks and embeddings from the persisted document content.
      operationId: ReindexKnowledgeDocument
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReindexKnowledgeDocumentResult"
        "404":
          description: Not Found
        "500":
          description: Internal Server Error
components:
  schemas:
    AddBeersToCartJson:
      required:
        - orderId
        - rows
      type: object
      properties:
        orderId:
          type: string
        rows:
          type: array
          items:
            $ref: "#/components/schemas/SalesOrderRowJson"
    AddItemStockJson:
      type: object
      properties:
        id:
          type: string
        warehouseId:
          type: string
        beerId:
          type: string
        quantity:
          pattern: ^-?(?:0|[1-9]\d*)(?:\.\d+)?$
          type:
            - number
            - string
          format: double
        unitOfMeasure:
          type: string
    ChatRequest:
      required:
        - message
      type: object
      properties:
        message:
          type: string
        conversationId:
          type:
            - "null"
            - string
    CreatePurchaseOrderJson:
      required:
        - orderNumber
        - orderDate
        - supplierId
        - rows
      type: object
      properties:
        orderNumber:
          type: string
        orderDate:
          type: string
          format: date-time
        supplierId:
          type: string
        deliveryDate:
          type: string
          format: date-time
        rows:
          type: array
          items:
            $ref: "#/components/schemas/PurchaseOrderRowJson"
    CreateSalesOrderJson:
      required:
        - orderNumber
        - orderDate
        - customerId
        - customerName
        - rows
      type: object
      properties:
        orderNumber:
          type: string
        orderDate:
          type: string
          format: date-time
        customerId:
          type: string
        customerName:
          type: string
        deliveryDate:
          type: string
          format: date-time
        rows:
          type: array
          items:
            $ref: "#/components/schemas/SalesOrderRowJson"
    CreateWarehouseJson:
      required:
        - name
      type: object
      properties:
        name:
          type: string
    CustomerJson:
      required:
        - customerId
        - ragioneSociale
        - partitaIva
        - consumerLevel
        - indirizzo
        - budgetLimit
        - isEnabled
      type: object
      properties:
        customerId:
          type: string
        ragioneSociale:
          type: string
        partitaIva:
          type: string
        consumerLevel:
          type: string
        indirizzo:
          $ref: "#/components/schemas/IndirizzoJson"
        budgetLimit:
          pattern: ^-?(?:0|[1-9]\d*)(?:\.\d+)?$
          type:
            - number
            - string
          format: double
        isEnabled:
          type: boolean
    CustomerPropertiesJson:
      required:
        - customerId
        - isEnabled
        - consumerLevel
        - budgetLimit
      type: object
      properties:
        customerId:
          type: string
        isEnabled:
          type: boolean
        consumerLevel:
          type: string
        budgetLimit:
          pattern: ^-?(?:0|[1-9]\d*)(?:\.\d+)?$
          type:
            - number
            - string
          format: double
    DocumentScope:
      required:
        - name
      type: object
      properties:
        name:
          type: string
    DocumentSource:
      required:
        - name
      type: object
      properties:
        name:
          type: string
    EditCustomerJson:
      required:
        - customerId
        - ragioneSociale
        - partitaIva
      type: object
      properties:
        customerId:
          type: string
        ragioneSociale:
          type: string
        partitaIva:
          type: string
        indirizzo:
          $ref: "#/components/schemas/IndirizzoJson"
    GetKnowledgeDocumentChunksResult:
      required:
        - documentId
        - chunkCount
        - chunks
      type: object
      properties:
        documentId:
          type: string
          format: uuid
        chunkCount:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
            - integer
            - string
          format: int32
        chunks:
          type: array
          items:
            $ref: "#/components/schemas/KnowledgeDocumentChunkResult"
    GetKnowledgeDocumentResult:
      required:
        - id
        - title
        - scope
        - source
        - tags
        - importedAt
        - content
        - chunkCount
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        scope:
          type: string
        source:
          type: string
        tags:
          type: array
          items:
            type: string
        importedAt:
          type: string
          format: date-time
        content:
          type: string
        chunkCount:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
            - integer
            - string
          format: int32
    GetKnowledgeDocumentsResult:
      required:
        - documents
      type: object
      properties:
        documents:
          type: array
          items:
            $ref: "#/components/schemas/KnowledgeDocumentSummary"
    HttpValidationProblemDetails:
      type: object
      properties:
        type:
          type:
            - "null"
            - string
        title:
          type:
            - "null"
            - string
        status:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
            - "null"
            - integer
            - string
          format: int32
        detail:
          type:
            - "null"
            - string
        instance:
          type:
            - "null"
            - string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    IndirizzoJson:
      required:
        - via
        - numeroCivico
        - citta
        - provincia
        - cap
        - nazione
      type: object
      properties:
        via:
          type: string
        numeroCivico:
          type: string
        citta:
          type: string
        provincia:
          type: string
        cap:
          type: string
        nazione:
          type: string
    IngestKnowledgeDocument:
      required:
        - title
        - content
        - scope
        - source
      type: object
      properties:
        title:
          type: string
        content:
          type: string
        scope:
          $ref: "#/components/schemas/DocumentScope"
        source:
          $ref: "#/components/schemas/DocumentSource"
        tags:
          type:
            - "null"
            - array
          items:
            type: string
    KeyValuePairOfstringAndStringValues:
      required:
        - key
        - value
      type: object
      properties:
        key:
          type:
            - "null"
            - string
        value:
          type: array
          items:
            type: string
    KnowledgeDocumentChunkResult:
      required:
        - id
        - sequence
        - tokenCount

<div class="page-container">
  <div class="page-header">
    <h2 class="page-title">Warehouses</h2>
    <button mat-raised-button color="primary" (click)="openAddDialog()">
      <mat-icon>add</mat-icon> Add Warehouse
    </button>
  </div>

  @if (isLoading()) {
    <div class="loading-container"><mat-spinner diameter="48"></mat-spinner></div>
  } @else {
    <mat-card>
      <mat-card-content>
        <table mat-table [dataSource]="warehouses()" class="full-width-table">
          <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef>ID</th>
            <td mat-cell *matCellDef="let w">{{ w.id }}</td>
          </ng-container>

          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef>Name</th>
            <td mat-cell *matCellDef="let w">{{ w.name }}</td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

          <tr class="mat-row" *matNoDataRow>
            <td class="mat-cell no-data" [attr.colspan]="displayedColumns.length">No warehouses found.</td>
          </tr>
        </table>

        <mat-paginator
          [length]="totalRecords()"
          [pageIndex]="pageIndex"
          [pageSize]="pageSize"
          [pageSizeOptions]="[5, 10, 25]"
          (page)="onPageChange($event)"
          showFirstLastButtons>
        </mat-paginator>
      </mat-card-content>
    </mat-card>
  }
</div>

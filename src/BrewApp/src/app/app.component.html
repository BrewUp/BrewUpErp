<mat-toolbar color="primary" class="app-toolbar">
  <span>BrewUp ERP</span>
</mat-toolbar>

<mat-sidenav-container class="app-sidenav-container">
  <mat-sidenav mode="side" opened class="app-nav">
    <mat-nav-list>
      <a mat-list-item routerLink="/chat" routerLinkActive="active-link">
        <mat-icon matListItemIcon>chat</mat-icon>
        <span matListItemTitle>AI Chat</span>
      </a>

      <mat-divider></mat-divider>
      <div class="nav-section-label">Master Data</div>

      <a mat-list-item routerLink="/master-data/beers" routerLinkActive="active-link">
        <mat-icon matListItemIcon>sports_bar</mat-icon>
        <span matListItemTitle>Beers</span>
      </a>
      <a mat-list-item routerLink="/master-data/customers" routerLinkActive="active-link">
        <mat-icon matListItemIcon>people</mat-icon>
        <span matListItemTitle>Customers</span>
      </a>
      <a mat-list-item routerLink="/master-data/warehouses" routerLinkActive="active-link">
        <mat-icon matListItemIcon>warehouse</mat-icon>
        <span matListItemTitle>Warehouses</span>
      </a>

      <mat-divider></mat-divider>
      <div class="nav-section-label">Operations</div>

      <a mat-list-item routerLink="/sales" routerLinkActive="active-link">
        <mat-icon matListItemIcon>shopping_cart</mat-icon>
        <span matListItemTitle>Sales Orders</span>
      </a>
      <a mat-list-item routerLink="/warehouse/shipments" routerLinkActive="active-link">
        <mat-icon matListItemIcon>local_shipping</mat-icon>
        <span matListItemTitle>Shipments</span>
      </a>
      <a mat-list-item routerLink="/purchases" routerLinkActive="active-link">
        <mat-icon matListItemIcon>receipt_long</mat-icon>
        <span matListItemTitle>Purchases</span>
      </a>

      <mat-divider></mat-divider>
      <div class="nav-section-label">Analytics</div>

      <a mat-list-item routerLink="/dashboards" routerLinkActive="active-link">
        <mat-icon matListItemIcon>bar_chart</mat-icon>
        <span matListItemTitle>Dashboards</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="app-content">
    <router-outlet />
  </mat-sidenav-content>
</mat-sidenav-container>
